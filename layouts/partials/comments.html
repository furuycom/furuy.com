{{- if .Param "comments" -}}
<br />
<div class="comments">
    <script
        src="https://giscus.app/client.js"
        data-repo="furuycom/furuy.com"
        data-repo-id="R_kgDOJ4bUIg"
        data-category="giscus"
        data-category-id="DIC_kwDOJ4bUIs4CZIXa"
        data-mapping="pathname"
        data-strict="1"
        data-reactions-enabled="1"
        data-emit-metadata="0"
        data-input-position="bottom"
        data-theme="preferred_color_scheme"
        data-lang="{{ .Lang }}"
        data-loading="lazy"
        crossorigin="anonymous"
        async
    ></script>

    <script>
        // Keep Giscus in sync with the site theme.
        (() => {
            const container = document.currentScript.parentElement;
            const syncTheme = () => {
                const iframe = container.querySelector("iframe.giscus-frame");
                if (!iframe) return;

                iframe.contentWindow.postMessage(
                    {
                        giscus: {
                            setConfig: {
                                theme:
                                    document.documentElement.dataset.theme ===
                                    "dark"
                                        ? "transparent_dark"
                                        : "light",
                            },
                        },
                    },
                    "https://giscus.app",
                );
            };

            new MutationObserver(syncTheme).observe(document.documentElement, {
                attributes: true,
                attributeFilter: ["data-theme"],
            });

            const attach = () => {
                const iframe = container.querySelector("iframe.giscus-frame");
                if (!iframe) return false;

                iframe.addEventListener("load", syncTheme, { once: true });
                syncTheme();
                return true;
            };

            if (!attach()) {
                const observer = new MutationObserver(() => {
                    if (attach()) observer.disconnect();
                });
                observer.observe(container, { childList: true, subtree: true });
            }
        })();
    </script>
</div>
{{- end -}}
