baseURL = "https://furuy.com/"
title = "Furkan Uysal"
theme = "PaperMod"
cleanDestinationDir = true
disableHugoGeneratorInject = true
enableRobotsTXT = true
enableGitInfo = true
timeZone = "Europe/Istanbul"
defaultContentLanguage = "tr"
locale = "tr-TR"
copyright = "[Arşiv](/arsiv/) · [Yasal](/yasal/) · [CC0 1.0 Evrensel](/yasal/#lisans-cc0-10)"

[permalinks]
    [permalinks.page]
        yazilar = "/:slugorcontentbasename/"
    [permalinks.taxonomy]
        tags = "/etiketler/"
    [permalinks.term]
        tags = "/etiketler/:slug/"

[taxonomies]
    tag = "tags"

[outputs]
    home = ["HTML", "RSS", "JSON"]

[minify]
    disableXML = true
    minifyOutput = true

[params]
    author = "Furkan Uysal"
    description = "Furkan Uysal'ın kişisel sitesi. CV, projeler ve yazılar."
    DateFormat = "2 January 2006"
    hideAuthor = true
    comments = true
    ShowReadingTime = true
    ShowPostNavLinks = true
    ShowCodeCopyButtons = true
    ShowRssButtonInSectionTermList = true
    UseHugoToc = true
    ShowToc = true

    [params.assets]
        disableHLJS = true
        theme_color = "#050608"
        msapplication_TileColor = "#0c8f60"
        favicon = "/assets/brand/favicon.svg"
        favicon16x16 = "/assets/brand/favicon-16x16.png"
        favicon32x32 = "/assets/brand/favicon-32x32.png"
        apple_touch_icon = "/assets/brand/apple-touch-icon.png"
        safari_pinned_tab = "/assets/brand/boru-monochrome.svg"

    [params.label]
        text = "Furkan Uysal"
        icon = "/assets/brand/boru-social.svg"

    [[params.socialIcons]]
        name = "github"
        title = "GitHub"
        url = "https://github.com/furuycom"

    [[params.socialIcons]]
        name = "mastodon"
        title = "Mastodon"
        url = "https://mastodon.social/@furuycom"

    [[params.socialIcons]]
        name = "linkedin"
        title = "LinkedIn"
        url = "https://www.linkedin.com/in/furkanuysal"

    [[params.socialIcons]]
        name = "email"
        title = "Email"
        url = "mailto:furuycom@protonmail.com"

    [params.cover]
        hidden = true

    [params.fuseOpts]
        distance = 1000
        limit = 10

    [params.profileMode]
        enabled = true
        title = "Furkan Uysal"
        imageUrl = "/assets/brand/boru-social.svg"
        imageTitle = "Furkan Uysal"
        imageWidth = 120
        imageHeight = 120

    [params.schema]
        publisherType = "Person"
        sameAs = [
            "https://github.com/furuycom",
            "https://mastodon.social/@furuycom",
            "https://www.linkedin.com/in/furkanuysal",
        ]

    [params.editPost]
        URL = "https://github.com/furuycom/furuy.com/edit/main/content"
        Text = "Değişiklik Öner"
        appendFilePath = true

[[menus.main]]
    identifier = "yazilar"
    name = "Yazılar"
    pageRef = "/yazilar/"
    weight = 10

[[menus.main]]
    identifier = "araclar"
    name = "Araçlar"
    pageRef = "/araclar/"
    weight = 20

[[menus.main]]
    identifier = "cv"
    name = "CV"
    pageRef = "/cv/"
    weight = 30

[[menus.main]]
    identifier = "ara"
    name = "Ara"
    pageRef = "/ara/"
    weight = 40

[frontmatter]
    lastmod = ["lastmod", ":git", "date", "publishDate"]

[markup]
    [markup.highlight]
        noClasses = false
        lineNos = true
        guessSyntax = true
    [markup.goldmark.renderer]
        unsafe = true

[imaging.exif]
    disableDate = true
    disableLatLong = true
    excludeFields = ".*"

[privacy]
    [privacy.youTube]
        privacyEnhanced = true

[[cascade]]
    [cascade.params]
        robotsNoIndex = true
    [cascade.sitemap]
        disable = true
    [cascade.target]
        kind = "{taxonomy,term}"
