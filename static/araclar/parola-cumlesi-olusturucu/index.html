<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Türkçe parola cümlesi (passphrase) oluşturucu.">
  <meta name="keywords" content="parola cümlesi oluşturucu, Türkçe passphrase, passphrase oluşturucu, güvenli parola oluşturucu, rastgele parola, diceware, parola üretici, şifre oluşturucu">
  <meta name="robots" content="index, follow">
  <meta name="application-name" content="Parola Cümlesi Oluşturucu">
  <meta name="theme-color" content="#1f6f62">
  <link rel="canonical" href="https://furuy.com/araclar/parola-cumlesi-olusturucu/">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="tr_TR">
  <meta property="og:title" content="Parola Cümlesi Oluşturucu">
  <meta property="og:description" content="Türkçe parola cümlesi (passphrase) oluşturucu.">
  <meta property="og:url" content="https://furuy.com/araclar/parola-cumlesi-olusturucu/">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Parola Cümlesi Oluşturucu">
  <meta name="twitter:description" content="Türkçe parola cümlesi (passphrase) oluşturucu.">
  <title>Parola Cümlesi Oluşturucu</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎲</text></svg>">
  <link rel="stylesheet" href="style.css">
  <script src="turkce-parola-cumlesi-listesi.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <main class="page">
    <section class="tool-shell" aria-labelledby="toolTitle">
      <header class="tool-header">
        <div class="title-row">
          <h1 id="toolTitle"><span class="title-icon" aria-hidden="true">🎲</span><span>Parola Cümlesi Oluşturucu</span></h1>
          <a id="faqToggle" class="help-button" href="/tr/turkce-parola-cumlesi-olusturucu/" target="_blank" rel="noopener noreferrer" aria-label="Parola cümlesi hakkında bilgi">?</a>
        </div>
      </header>

      <noscript>
        <p class="message message-error">Bu aracın çalışması için JavaScript gerekir.</p>
      </noscript>

      <p id="errorBox" class="message message-error" role="alert" hidden></p>

      <section class="output-section" aria-labelledby="outputTitle">
        <h2 id="outputTitle" class="screen-reader-only">Üretilen parola cümlesi</h2>
        <div id="passphraseOutput" class="passphrase-output" role="textbox" aria-readonly="true" tabindex="0" aria-describedby="copyStatus"></div>

        <div class="button-row">
          <button id="refreshButton" class="button button-primary" type="button"><span aria-hidden="true">↻</span> Yenile</button>
          <button id="copyButton" class="button button-secondary" type="button"><span aria-hidden="true">⧉</span> Kopyala</button>
        </div>
        <p id="copyStatus" class="status" role="status" aria-live="polite"></p>
      </section>

      <form id="settingsForm" class="settings" aria-label="Parola cümlesi ayarları">
        <div class="field field-number">
          <label for="wordCount">Kelime sayısı</label>
          <input id="wordCount" name="wordCount" type="number" min="1" step="1" value="5" inputmode="numeric">
        </div>

        <div class="field">
          <label for="separator">Ayraç</label>
          <input id="separator" name="separator" type="text" value="-" spellcheck="false" autocomplete="off">
        </div>

        <div class="check-group">
          <div class="check-row">
            <input id="capitalize" name="capitalize" type="checkbox">
            <label for="capitalize">Baş harfleri büyüt</label>
          </div>

          <div class="check-row">
            <input id="addRandomDigit" name="addRandomDigit" type="checkbox">
            <label for="addRandomDigit">Rastgele rakam ekle</label>
          </div>
        </div>

      </form>

      <span id="listSize" hidden></span>
      <footer class="privacy-note" id="privacyNote">
        <a href="/tr/"><span aria-hidden="true">↗</span> Sitemi ziyaret edin</a>
        <a href="https://github.com/furuycom/furuy.com/tree/main/static/araclar/parola-cumlesi-olusturucu/" target="_blank" rel="noopener noreferrer"><span aria-hidden="true">&lt;/&gt;</span> GitHub</a>
        <a href="https://github.com/sponsors/furuycom" target="_blank" rel="noopener noreferrer"><span aria-hidden="true">♡</span> Sponsor</a>
      </footer>
    </section>
  </main>
</body>
</html>
